<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" role="img" aria-label="FlowIQ Portfolio and Marketing Copilot Hero">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="340" rx="6" fill="url(#hero-bg)"/>
  <rect x="1" y="1" width="1078" height="338" rx="5" fill="none" stroke="#d29e3d" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="0" y1="2" x2="1080" y2="2" stroke="#d29e3d" stroke-width="3"/>

  <!-- Left Narrative Region (x=48..720) -->
  <text x="48" y="42" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2">/ FLOW INTELLIGENCE · PORTFOLIO &amp; MARKETING COPILOT</text>

  <text x="48" y="94" fill="#e8ecf4" font-family="Georgia, serif" font-size="38" font-weight="600">Eight buildings. 1,100 units.</text>
  <text x="48" y="140" fill="#d29e3d" font-family="Georgia, serif" font-size="38" font-weight="600">One reconciled portfolio.</text>

  <text x="48" y="182" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="14">Answers leasing, renewal, and ad-spend questions across 6 messy exports—every number tied to its source row.</text>

  <!-- Vertical separator before Right Skyline Illustration -->
  <line x1="756" y1="28" x2="756" y2="206" stroke="#e8ecf4" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Right Minimalist Architectural Skyline Illustration (x=780..1032, y=28..206) -->
  <g transform="translate(780, 28)">
    <rect x="0" y="0" width="252" height="178" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.14"/>
    <text x="16" y="22" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.8">P01–P08 ACTIVE  ·  P09 ON HOLD</text>

    <!-- Baseline -->
    <line x1="16" y1="146" x2="236" y2="146" stroke="#d29e3d" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- 8 Operating Buildings (Solid Gold/Slate Towers) -->
    <rect x="20" y="76" width="16" height="70" rx="1.5" fill="#233763" stroke="#d29e3d" stroke-width="1"/>
    <rect x="42" y="54" width="16" height="92" rx="1.5" fill="#2c4478" stroke="#d29e3d" stroke-width="1"/>
    <rect x="64" y="68" width="16" height="78" rx="1.5" fill="#233763" stroke="#d29e3d" stroke-width="1"/>
    <rect x="86" y="60" width="16" height="86" rx="1.5" fill="#2c4478" stroke="#d29e3d" stroke-width="1"/>
    <rect x="108" y="84" width="16" height="62" rx="1.5" fill="#233763" stroke="#d29e3d" stroke-width="1"/>
    <rect x="130" y="72" width="16" height="74" rx="1.5" fill="#2c4478" stroke="#d29e3d" stroke-width="1"/>
    <rect x="152" y="44" width="18" height="102" rx="1.5" fill="#d29e3d" fill-opacity="0.88"/>
    <rect x="176" y="64" width="16" height="82" rx="1.5" fill="#2c4478" stroke="#d29e3d" stroke-width="1"/>

    <!-- 9th Building: P09 Quarantined Stub (Dashed Gold Outline) -->
    <rect x="204" y="96" width="24" height="50" rx="1.5" fill="none" stroke="#d29e3d" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="216" y="90" text-anchor="middle" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">P09</text>

    <text x="16" y="165" fill="#9aa7bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">8 Active (1,100u) · 1 Hold (0u)</text>
  </g>

  <!-- Horizontal Divider above Bottom KPI Strip -->
  <line x1="48" y1="216" x2="1032" y2="216" stroke="#e8ecf4" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Bottom KPI Strip (y=230..314, 4 Spacious Cards across x=48..1032) -->
  <!-- Card 1: x=48, width=234 -->
  <g transform="translate(48, 230)">
    <rect width="234" height="84" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.14"/>
    <line x1="0" y1="0" x2="234" y2="0" stroke="#d29e3d" stroke-width="2"/>
    <text x="16" y="22" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.6">PORTFOLIO OCCUPANCY</text>
    <text x="16" y="52" fill="#e8ecf4" font-family="Georgia, serif" font-size="28" font-weight="600">93.9%</text>
    <text x="16" y="72" fill="#9aa7bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">1,033 / 1,100 Units Occupied</text>
  </g>

  <!-- Card 2: x=300, width=234 -->
  <g transform="translate(300, 230)">
    <rect width="234" height="84" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.14"/>
    <line x1="0" y1="0" x2="234" y2="0" stroke="#d29e3d" stroke-width="2"/>
    <text x="16" y="22" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.6">DEAD SPEND RECOVERED</text>
    <text x="16" y="52" fill="#e8ecf4" font-family="Georgia, serif" font-size="28" font-weight="600">$46,599.90</text>
    <text x="16" y="72" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Wasted Ad Spend -&gt; +15 Leases</text>
  </g>

  <!-- Card 3: x=552, width=234 -->
  <g transform="translate(552, 230)">
    <rect width="234" height="84" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.14"/>
    <line x1="0" y1="0" x2="234" y2="0" stroke="#d29e3d" stroke-width="2"/>
    <text x="16" y="22" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.6">DATA HYGIENE GATES</text>
    <text x="16" y="52" fill="#e8ecf4" font-family="Georgia, serif" font-size="28" font-weight="600">6 Traps Caught</text>
    <text x="16" y="72" fill="#9aa7bd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">P09 Stub · CAD FX · Void Bills</text>
  </g>

  <!-- Card 4: x=804, width=228 -->
  <g transform="translate(804, 230)">
    <rect width="228" height="84" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.14"/>
    <line x1="0" y1="0" x2="228" y2="0" stroke="#d29e3d" stroke-width="2"/>
    <text x="16" y="22" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.6">ROW-LEVEL VERIFICATION</text>
    <text x="16" y="52" fill="#e8ecf4" font-family="Georgia, serif" font-size="28" font-weight="600">600 / 600</text>
    <text x="16" y="72" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Stress-Test Queries Verified</text>
  </g>
</svg>
