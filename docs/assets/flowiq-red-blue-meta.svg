<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" width="1080" height="280" role="img" aria-label="Red Team Stress Test, Model Harness, and Simplicity Gate">
  <defs>
    <linearGradient id="rb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>
    <marker id="rb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d29e3d"/>
    </marker>
  </defs>

  <rect width="1080" height="280" rx="6" fill="url(#rb-bg)"/>
  <rect x="1" y="1" width="1078" height="278" rx="5" fill="none" stroke="#d29e3d" stroke-opacity="0.3" stroke-width="1.25"/>
  <line x1="0" y1="2" x2="1080" y2="2" stroke="#d29e3d" stroke-width="2.5"/>

  <text x="36" y="34" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.0">/ BLINDED STRESS TESTING, PORTABLE MODEL HARNESS &amp; SIMPLICITY GATE</text>
  <text x="36" y="64" fill="#e8ecf4" font-family="Georgia, serif" font-size="25" font-weight="600">How we test for edge cases and scale across models without adding code bloat.</text>
  <line x1="36" y1="80" x2="1044" y2="80" stroke="#e8ecf4" stroke-opacity="0.12"/>

  <!-- Column 1 (x=36, y=96, w=312, h=160) -->
  <g transform="translate(36, 96)">
    <rect width="312" height="160" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.15"/>
    <line x1="0" y1="0" x2="312" y2="0" stroke="#d29e3d" stroke-width="2"/>
    <text x="18" y="26" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">1. RED TEAM STRESS TEST</text>
    <text x="18" y="52" fill="#e8ecf4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="16" font-weight="600">600 Queries + 18 Attacks</text>
    <text x="18" y="80" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Blinded evaluator reads AGENTS.md only</text>
    <text x="18" y="102" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Tests prompt injection &amp; Fair Housing</text>
    <text x="18" y="124" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Verifies multi-step question pairs</text>
    <text x="18" y="146" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">18/18 attacks blocked · 600/600 pass</text>
  </g>

  <line x1="352" y1="176" x2="378" y2="176" stroke="#d29e3d" stroke-width="1.5" marker-end="url(#rb-arrow)"/>

  <!-- Column 2 (x=384, y=96, w=312, h=160) -->
  <g transform="translate(384, 96)">
    <rect width="312" height="160" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.15"/>
    <line x1="0" y1="0" x2="312" y2="0" stroke="#d29e3d" stroke-width="2"/>
    <text x="18" y="26" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">2. MODEL &amp; TEMPORAL HARNESS</text>
    <text x="18" y="52" fill="#e8ecf4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="16" font-weight="600">Ollama · OpenRouter · Grok</text>
    <text x="18" y="80" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Works with local or cloud LLMs</text>
    <text x="18" y="102" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• 8-slot parallel Temporal LLM swarm</text>
    <text x="18" y="124" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Resumes from crash with 0 duplicates</text>
    <text x="18" y="146" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">0.37 ms replay · Sealed key vault</text>
  </g>

  <line x1="700" y1="176" x2="726" y2="176" stroke="#d29e3d" stroke-width="1.5" marker-end="url(#rb-arrow)"/>

  <!-- Column 3 (x=732, y=96, w=312, h=160) -->
  <g transform="translate(732, 96)">
    <rect width="312" height="160" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.15"/>
    <line x1="0" y1="0" x2="312" y2="0" stroke="#34d399" stroke-width="2"/>
    <text x="18" y="26" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">3. SIMPLICITY &amp; CITATION GATE</text>
    <text x="18" y="52" fill="#e8ecf4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="16" font-weight="600">100% Verified, Zero Bloat</text>
    <text x="18" y="80" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Checks every cited row ID on output</text>
    <text x="18" y="102" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Explicit { unknown: true } abstention</text>
    <text x="18" y="124" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Fixes simplify rules, never add bloat</text>
    <text x="18" y="146" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">bloatPenalty = 0 · 3,858 IDs checked</text>
  </g>
</svg>
