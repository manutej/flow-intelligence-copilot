    <text x="16" y="82" fill="#e8ecf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">data/{pms,crm,ils,ops}</text>
    <text x="16" y="108" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• 3,858 source rows indexed</text>
    <text x="16" y="130" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• PMS units &amp; lease rolls</text>
    <text x="16" y="152" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• CRM leads, bills &amp; X001–X010</text>
