    <text x="16" y="108" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Occupancy, renewals &amp; CPSL</text>
    <text x="16" y="130" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• $46.6k waste -&gt; +15 leases</text>
    <text x="16" y="152" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Bayesian small-sample guard</text>
    <text x="16" y="178" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Pure O(N) joins · 0 LLM math</text>
  </g>

  <line x1="790" y1="194" x2="812" y2="194" stroke="#d29e3d" stroke-width="1.5" marker-end="url(#pipe-arrow)"/>

