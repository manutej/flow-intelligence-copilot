    <text x="16" y="82" fill="#e8ecf4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">copilot.ts &amp; temporal</text>
    <text x="16" y="108" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Web UI, CLI &amp; stdio MCP</text>
    <text x="16" y="130" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• 8-worker Temporal LLM swarm</text>
    <text x="16" y="152" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Row-key citation verifier</text>
