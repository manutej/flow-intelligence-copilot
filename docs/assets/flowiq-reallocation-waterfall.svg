    <text x="18" y="84" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Routed to Apartments.com (best CPSL)</text>
    <text x="18" y="106" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• $84,560 spend / 29 leases = $2,915.86</text>
    <text x="18" y="128" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• $46,599.90 / $2,915.86 = 15.98 leases</text>
    <text x="18" y="150" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">15 whole leases (rounded down)</text>
