<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="FLOW-102 Paid Channel Contrast Bars and $46,599.90 Dead-Spend Reallocation">
  <defs>
