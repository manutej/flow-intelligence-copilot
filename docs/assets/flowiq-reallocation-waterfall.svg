    <line x1="0" y1="0" x2="312" y2="0" stroke="#d29e3d" stroke-width="2"/>
    <text x="18" y="26" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">2. SMALL-SAMPLE GUARD (FLOW-105)</text>
    <text x="18" y="58" fill="#e8ecf4" font-family="Georgia, serif" font-size="28" font-weight="600">Prior β₀ = $3,250</text>
    <text x="18" y="84" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Protects X009 (P01 Facebook Ads)</text>
