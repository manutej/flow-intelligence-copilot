      <text x="12" y="21" fill="#d29e3d" font-family="'JetBrains Mono', monospace" font-size="10.5">/ B03 COUNTERFACTUAL REALLOCATION YIELD</text>
      <text x="12" y="42" fill="#eceae3" font-family="'Cormorant Garamond', Georgia, serif" font-size="20">floor($46,599.90 ÷ $2,915.8621) = <tspan fill="#d29e3d">+15 whole leases</tspan> (15.98)</text>
