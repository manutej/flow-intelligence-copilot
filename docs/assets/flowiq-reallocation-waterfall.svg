  <text x="36" y="64" fill="#e8ecf4" font-family="Georgia, serif" font-size="25" font-weight="600">Moving $46,599.90 in dead spend buys +15 leases—while protecting small samples.</text>
  <line x1="36" y1="80" x2="1044" y2="80" stroke="#e8ecf4" stroke-opacity="0.12"/>

  <!-- Left Box: Dead Ad Spend ($46,599.90) (x=36, y=96, w=312, h=178) -->
  <g transform="translate(36, 96)">
    <rect width="312" height="178" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.15"/>
    <line x1="0" y1="0" x2="312" y2="0" stroke="#f87171" stroke-width="2"/>
    <text x="18" y="26" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">1. DEAD AD SPEND IDENTIFIED (T04)</text>
    <text x="18" y="58" fill="#e8ecf4" font-family="Georgia, serif" font-size="30" font-weight="600">$46,599.90</text>
    <text x="18" y="84" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• 9 building-channel pairs with 0 leases</text>
    <text x="18" y="106" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Led by P01 Zillow ($9,690, 5m post)</text>
    <text x="18" y="128" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Plus P05 Apartments.com ($7,340)</text>
    <text x="18" y="150" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• Plus P08 Zillow ($6,650, X010)</text>
  </g>

  <line x1="352" y1="185" x2="378" y2="185" stroke="#d29e3d" stroke-width="1.5" marker-end="url(#wf-arrow)"/>

