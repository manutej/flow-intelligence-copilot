    <text x="18" y="128" fill="#b4bfd3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif" font-size="12">• 74.7% chance of 0 leases by luck</text>
    <text x="18" y="150" fill="#d29e3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Smoothed CPSL: $3,295.00 (Rank #2)</text>
  </g>

  <line x1="700" y1="185" x2="726" y2="185" stroke="#d29e3d" stroke-width="1.5" marker-end="url(#wf-arrow)"/>

  <!-- Right Box: Reallocated Yield (x=732, y=96, w=312, h=178) -->
  <g transform="translate(732, 96)">
    <rect width="312" height="178" rx="5" fill="#0d172e" stroke="#e8ecf4" stroke-opacity="0.15"/>
    <line x1="0" y1="0" x2="312" y2="0" stroke="#34d399" stroke-width="2"/>
    <text x="18" y="26" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">3. REALLOCATED PORTFOLIO YIELD (B03)</text>
