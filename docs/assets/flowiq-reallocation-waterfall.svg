  <text x="28" y="58" fill="#eceae3" font-family="'Cormorant Garamond', Georgia, serif" font-weight="300" font-size="26">Moving $46,599.90 from 9 zero-lease pairs to Apartments.com ($2,915.86/lease) buys +15 leases.</text>
