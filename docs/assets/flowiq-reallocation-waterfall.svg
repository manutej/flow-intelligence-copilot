      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d29e3d"/>
    </marker>
  </defs>

  <rect width="1080" height="300" rx="6" fill="url(#wf-bg)"/>
  <rect x="1" y="1" width="1078" height="298" rx="5" fill="none" stroke="#d29e3d" stroke-opacity="0.3" stroke-width="1.25"/>
  <line x1="0" y1="2" x2="1080" y2="2" stroke="#d29e3d" stroke-width="2.5"/>

